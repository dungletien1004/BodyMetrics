# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# A persistent disk needs a paid instance type (starter or above).
services:
  - type: web
    name: bodymetrics
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: bodymetrics-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: MCP_TOKEN
        generateValue: true
      - key: AUTH_USERNAME
        value: admin
      # Asked for when the Blueprint is created; used once to create the account.
      - key: AUTH_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
